server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Static game: serve files, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
